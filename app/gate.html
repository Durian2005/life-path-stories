<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>正在进入 · 人生的路你走到哪了</title>
<link rel="stylesheet" href="assets/style.css?v=20261105m">
<!-- 必须同步、在 body 之前：首帧就定下昼夜，否则会先白一下再变黑 -->
<script src="assets/theme.js?v=20261105m"></script>
</head>
<body class="gate-body">

<!-- 门页没有顶栏，切换按钮浮在右上角（卡片是居中的，不冲突） -->
<button class="theme-toggle" type="button" aria-label="切换白天 / 夜间" aria-pressed="false">
  <span class="theme-toggle__opt" data-mode="light" aria-hidden="true" title="白天">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </span>
  <span class="theme-toggle__opt" data-mode="dark" aria-hidden="true" title="夜间">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </span>
</button>

<!-- V1.4：不再有访问口令。
     这个页面只剩一个职责 —— 在没有会话凭证时静默建号，然后回到原页面。
     老链接（带 ?k=）和海报二维码依旧指向这里，所以页面必须留着，
     但它不再有任何输入框：观众点开就是「正在进入…」，一两秒后落地到内容。 -->
<main class="gate">
  <p class="gate__brand">人生的路你走到哪了</p>
  <p class="gate__entering" id="entering">正在进入…</p>
  <p class="gate__err" id="err" hidden></p>
  <button class="btn btn--primary btn--block" id="retry" type="button" hidden>再试一次</button>
</main>

<!-- SDK 本地托管（0.1.4-dev.ca27990.202610161713 / 2026-10-16 构建）：原来从 jsdelivr 取，单次要 1.9 秒，教室网络不通就整站白屏 -->
<script src="assets/workbuddy-sdk.js?v=20261105m"></script>
<script src="assets/cloud-config.js?v=20261105m"></script>
<script src="assets/api.js?v=20261105m"></script>
<script src="assets/boot.js?v=20261105m"></script>
<script>
(function () {
  'use strict';

  var err = document.getElementById('err');
  var entering = document.getElementById('entering');
  var retry = document.getElementById('retry');

  // 从哪来：门页不该把原链接吞掉，通过后回到原来那一页（AC-04）
  var q = new URLSearchParams(location.search);
  var rawTo = q.get('to') || 'index.html';
  var to = /^https?:|^\/\//i.test(rawTo) ? 'index.html' : rawTo;

  /* 静态托管不发 Cache-Control，手机浏览器会按「上次修改时间」自己算一段缓存期，
     改完代码观众可能还看着旧的样式表。跳转时带一个版本参数绕开它。
     改前端后记得把 BUILD 一起改掉。 */
  var BUILD = '20261105m';
  function withBuild(u) {
    if (new RegExp('[?&]v=' + BUILD).test(u)) return u;
    return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'v=' + BUILD;
  }

  /* 落地地址：把老链接里的 ?k=（已作废的明文口令）去掉，
     其余查询参数原样带走 —— sharecode 丢了静态资源会 403。
     没写 to 时（海报二维码就是这种）用当前 search 拼回首页。 */
  function landing() {
    try {
      var u = new URL(to, location.href);
      u.searchParams.delete('k');
      if (!q.get('to')) {
        var here = new URLSearchParams(location.search);
        here.delete('k');
        here.delete('to');
        here.forEach(function (v, k) { if (!u.searchParams.has(k)) u.searchParams.set(k, v); });
      }
      return (u.pathname.replace(/^\//, '') || 'index.html') + u.search;
    } catch (e) {
      return to;
    }
  }

  function showError(msg) {
    entering.hidden = true;
    err.hidden = false;
    err.textContent = msg;
    retry.hidden = false;
  }

  async function enter() {
    err.hidden = true;
    retry.hidden = true;
    entering.hidden = false;
    try {
      // 没有口令这一步了：直接建号 / 取会话
      await window.Renlu.api.sessionInit();
      location.replace(withBuild(landing()));
    } catch (ex) {
      if (ex && ex.code === 42903) {
        showError('现在进入的人有点多，过一会儿再试');
        return;
      }
      showError((ex && ex.message) || '进不去，稍后再试');
    }
  }

  retry.addEventListener('click', enter);

  // 已经有凭证：门口不再挡第二次
  if (window.Renlu && window.Renlu.session && window.Renlu.session.token) {
    location.replace(withBuild(landing()));
    return;
  }

  enter();
})();
</script>
</body>
</html>
