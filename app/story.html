<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>一段路 · 人生的路你走到哪了</title>
<link rel="stylesheet" href="assets/style.css?v=20261105m">
<!-- 必须同步、在 body 之前：首帧就定下昼夜，否则会先白一下再变黑 -->
<script src="assets/theme.js?v=20261105m"></script>
</head>
<body>

<nav class="nav nav--narrow">
  <div class="wrap nav__inner">
    <a class="nav__brand" href="index.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5.5 18.5c0-4 3.6-4.2 6.3-6.6 2.7-2.4 6.2-2.6 6.7-6.4"/>
        <circle cx="5.5" cy="18.5" r="1.7" fill="currentColor" stroke="none"/>
        <circle cx="18.5" cy="5.5" r="1.7" fill="currentColor" stroke="none"/>
      </svg>
      <span>人生的路你走到哪了</span>
      <span style="color:var(--ink-3)">.</span>
    </a>
    <div class="nav__right">
      <a class="nav__tagline nav__back" href="index.html">← 回到所有故事</a>
      <button class="theme-toggle" type="button" aria-label="切换白天 / 夜间" aria-pressed="false">
        <span class="theme-toggle__opt" data-mode="light" aria-hidden="true" title="白天">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </span>
        <span class="theme-toggle__opt" data-mode="dark" aria-hidden="true" title="夜间">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </span>
      </button>
      <a class="nav__add" href="write.html" aria-label="写一段我的经历">+</a>
    </div>
  </div>
</nav>

<main class="detail-main">
  <div class="wrap wrap--read">

    <!-- 加载中：用骨架占位，避免高度跳动 -->
    <div id="loading" class="skel">
      <div class="skel__line skel__line--sm"></div>
      <div class="skel__line skel__line--lg"></div>
      <div class="skel__line"></div>
      <div class="skel__line"></div>
      <div class="skel__line skel__line--md"></div>
    </div>

    <!-- 正常内容 -->
    <article id="article" hidden>
      <p class="crumb" id="crumb"></p>

      <div class="detail__tags" id="tags"></div>
      <h1 class="detail__title" id="title"></h1>

      <div class="detail__meta">
        <span id="author"></span>
        <span class="dot">·</span>
        <time id="created"></time>
        <span class="dot">·</span>
        <span id="stage"></span>
      </div>

      <div class="prose" id="prose">
        <section class="block" id="blockBefore">
          <h2 class="block__title">当时</h2>
          <div class="block__body" id="bodyBefore"></div>
        </section>

        <section class="block" id="blockAfter" hidden>
          <h2 class="block__title">后来</h2>
          <div class="block__body" id="bodyAfter"></div>
        </section>
      </div>

      <!-- open 态：作者还没写后来 -->
      <p class="hint" id="openHint" hidden>
        作者还没写后来。如果你正走在这段路上，可以先看看别人怎么走的。
      </p>

      <!-- 作者专属：补写入口 -->
      <section class="compose" id="compose" hidden>
        <button class="btn btn--primary" id="btnOpenResolve" type="button">补上「后来」</button>
        <form class="compose__form" id="resolveForm" hidden>
          <label class="compose__label" for="afterInput">后来发生了什么？</label>
          <textarea class="field field--area" id="afterInput" rows="7"
                    placeholder="不用写得完整。哪怕只是「现在能睡着了」，对同路的人也是有用的。"
                    maxlength="2000"></textarea>
          <div class="compose__foot">
            <span class="counter" id="afterCount">0 / 2000</span>
            <span class="compose__err" id="resolveErr"></span>
            <button class="btn btn--ghost" id="btnCancelResolve" type="button">先不写</button>
            <button class="btn btn--primary" id="btnSubmitResolve" type="submit">写完这段</button>
          </div>
        </form>
      </section>

      <!-- V1.2 读完后继：读完这一段，最自然的动作是接着读下一段，
           不该被扔回列表页顶部重新滚。放在动作区之上独占一行，因为它是「下一步」 -->
      <div class="detail__next">
        <button class="btn btn--primary btn--block" id="btnNext" type="button">再读一段 →</button>
      </div>

      <div class="detail__foot">
        <div class="detail__acts">
          <!-- 共鸣与点赞在 V1.3 挪到了右下角固定区（见 .fab）：
               读完一段时手还在往下滑，互动按钮要一直在手边，不能被滚走。
               这里只留「致谢」和「海报」—— 致谢说的是「被帮到」，与点赞不是一回事 -->
          <button class="thanks" id="btnThanks" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20.4s-7.6-4.6-7.6-9.6a4.2 4.2 0 0 1 7.6-2.6 4.2 4.2 0 0 1 7.6 2.6c0 5-7.6 9.6-7.6 9.6z"/>
            </svg>
            <span id="thanksText">0 人觉得被帮到</span>
          </button>
          <button class="thanks" id="btnPoster" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15V4m0 11 4-4m-4 4-4-4"/>
              <path d="M5 18.5h14"/>
            </svg>
            <span>生成海报</span>
          </button>
        </div>
        <a class="detail__more" href="index.html">回到所有故事 →</a>
      </div>
    </article>

    <!-- V1.3 右下角固定交互：脚印（我也走过这段）+ 点赞。
         position: fixed，滚动时不动；每一篇详情页都在同一位置、同一尺寸。
         竖排三个圆钮：足迹（共鸣）、点赞、收藏。前两个带计数，收藏不带。
         点过之后高亮，再点一下取消（三个都是 toggle）。
         示例内容整块隐藏：它能被看，但不参与任何计数。 -->
    <div class="fab" id="fab" hidden>
      <button class="fab__btn" id="fabFoot" type="button" aria-label="我也走过这段">
        <svg class="fab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- 一只赤脚印：五枚实心趾印（大拇趾最大，依次变小）+ 一笔连成的
               整只脚掌轮廓（前掌宽、足弓处收腰、脚跟圆），整只脚微倾，
               像走路时落在地上的那一脚。22px 里画两只脚会糊成一团，
               所以只留一只完整脚印，反而一眼认得出「有人走过」。 -->
          <g transform="rotate(-9 12 12)">
            <g fill="currentColor" stroke="none">
              <ellipse cx="5.4" cy="3.7" rx="1.45" ry="1.8"/>
              <ellipse cx="9" cy="2.5" rx="0.95" ry="1.2"/>
              <ellipse cx="12" cy="2.3" rx="0.85" ry="1.1"/>
              <ellipse cx="14.7" cy="2.7" rx="0.75" ry="0.95"/>
              <ellipse cx="17.2" cy="3.7" rx="0.65" ry="0.85"/>
            </g>
            <path d="M5 9.8 C5 7.6 7.6 6.3 11.2 6.3 C14.8 6.3 17.4 7.6 17.4 9.9 C17.4 12 16.4 13.9 15.2 15.2 C14.3 16.2 14 17.6 14.2 19 C14 20.7 10.2 21.4 8.3 20.1 C7.2 19.3 7.3 17.8 8.4 16.4 C9.5 15 9.3 13.7 7.6 12.4 C6 11.2 5 10.6 5 9.8 Z"/>
          </g>
        </svg>
        <span class="fab__n" id="fabFootText">…</span>
      </button>

      <button class="fab__btn" id="fabLike" type="button" aria-label="点赞">
        <svg class="fab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- 简笔竖大拇指：与「致谢」的心形区分开，避免两个心挤在同一页 -->
          <path d="M7 10.6v9"/>
          <path d="M7 10.6h2.5l1.8-5c.3-.9 1-1.4 1.8-1.4 1.1 0 1.9.9 1.9 2v3.3h3.4c1.1 0 1.9 1 1.7 2l-.9 6.1c-.1.9-.9 1.6-1.8 1.6H7z"/>
        </svg>
        <span class="fab__n" id="fabLikeText">…</span>
      </button>

      <!-- 收藏（V1.6.1）：五角星线稿，点亮后填实心。没有计数——收藏是给自己存的，不该有攀比 -->
      <button class="fab__btn" id="fabFav" type="button" aria-label="收藏这段">
        <svg class="fab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- 标准五角星：五个尖角 + 五个内凹点，中心 (12,12)，外半径 8.6 -->
          <path d="M12 4.2 L14.06 9.97 L20.18 10.14 L15.33 13.88 L17.06 19.76 L12 16.3 L6.94 19.76 L8.67 13.88 L3.82 10.14 L9.94 9.97 Z"/>
        </svg>
        <span class="fab__n fab__n--dot" id="fabFavText"></span>
      </button>
    </div>

    <!-- V1.1 海报层：canvas 画完长按保存，不动后端 -->
    <div id="posterLayer" hidden class="poster-layer">
      <div class="poster-box">
        <img id="posterImg" class="poster-img" alt="这段路的故事海报">
        <p class="poster-tip">
          <span class="tip-touch">长按图片可以保存 / 转发给同路的人</span>
          <span class="tip-mouse">右键图片可以另存为，或复制下面的链接转发</span>
        </p>
        <!-- V1.2 海报里的二维码是整站一张、只落到首页，收海报的人找不到这段。
             这里补一条能直接定位到本条故事的链接 -->
        <button class="btn btn--primary btn--block" id="btnCopyLink" type="button">复制这段的链接</button>
        <p class="poster-link" id="posterLink" hidden></p>
        <button class="btn btn--ghost" id="btnPosterClose" type="button">关闭</button>
      </div>
    </div>

    <!-- hidden：内容处理中，只给一句占位，不展示正文 -->
    <section id="hiddenView" hidden class="statebox">
      <h1 class="detail__title" id="hiddenTitle"></h1>
      <p class="hint hint--warn" id="hiddenNotice"></p>
      <a class="btn btn--ghost" href="index.html">回到所有故事</a>
    </section>

    <!-- 404：不存在 / 私密 / 已删除，三者同一套文案，不区分原因 -->
    <section id="missing" hidden class="statebox">
      <h1 class="statebox__title">这条内容不在了</h1>
      <p class="hint">可能作者删掉了，也可能这个链接本来就不对。</p>
      <a class="btn btn--primary" href="index.html">回到所有故事</a>
    </section>

    <!-- 其它错误 -->
    <section id="failed" hidden class="statebox">
      <h1 class="statebox__title">没能打开这一段</h1>
      <p class="hint" id="failMsg"></p>
      <button class="btn btn--ghost" id="btnRetry" type="button">重新加载</button>
    </section>

  </div>
</main>

<!-- SDK 本地托管（0.1.4-dev.ca27990.202610161713 / 2026-10-16 构建）：原来从 jsdelivr 取，单次要 1.9 秒，教室网络不通就整站白屏 -->
<script src="assets/workbuddy-sdk.js?v=20261105m"></script>
<script src="assets/cloud-config.js?v=20261105m"></script>
<script src="assets/api.js?v=20261105m"></script>
<script src="assets/boot.js?v=20261105m"></script>
<script>
const { api, ApiError } = window.Renlu;

const TOPIC = {
  study: '升学备考', job: '找工作', growth: '自我成长',
  relation: '关系', daily: '过日子',
  family: '家庭', money: '钱与生活', body: '身心状态',
};
const STAGE = {
  before_18: '18 岁以前', college: '大学阶段', graduation: '毕业前后',
  early_work: '初入职场', transition: '职业转型',
};

const $ = (id) => document.getElementById(id);
const storyId = new URLSearchParams(location.search).get('id');

/* 五个状态各有一块 DOM，显示哪个由 show() 决定，不在 render 里嵌套判断 */
const VIEWS = ['loading', 'article', 'hiddenView', 'missing', 'failed'];

function show(which) {
  VIEWS.forEach((v) => { $(v).hidden = v !== which; });
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
}

function statusTag(status) {
  const open = status === 'open';
  return `<span class="tag ${open ? 'tag--open' : 'tag--resolved'}">${open ? '还没走完' : '走过这一段'}</span>`;
}

/* ---------- 渲染 ---------- */

function render(d) {
  if (d.status === 'hidden') {
    $('hiddenTitle').textContent = d.title || '';
    $('hiddenNotice').textContent = d.notice || '这条内容正在处理中，暂时无法查看。';
    show('hiddenView');
    return;
  }

  $('crumb').textContent = `${TOPIC[d.topic_code] || '某一段路'} · 路上的故事`;
  $('title').textContent = d.title || '';
  $('author').textContent = d.author_nickname || '路过的人';
  $('created').textContent = fmtDate(d.created_at);
  $('stage').textContent = STAGE[d.life_stage] || '';

  // 标签：状态 + 主题 + 作者自选标签
  const tags = $('tags');
  tags.replaceChildren();
  const mk = (text, cls) => {
    const s = document.createElement('span');
    s.className = `tag ${cls}`;
    s.textContent = text;
    return s;
  };
  tags.append(mk(d.status === 'open' ? '还没走完' : '走过这一段', d.status === 'open' ? 'tag--open' : 'tag--resolved'));
  if (TOPIC[d.topic_code]) tags.append(mk(TOPIC[d.topic_code], 'tag--plain'));
  if (d.visibility === 'private') tags.append(mk('仅自己可见', 'tag--plain'));
  if (d.is_sample) tags.append(mk('示例', 'tag--plain'));
  (d.tags || []).forEach((t) => tags.append(mk(t, 'tag--plain')));

  // 正文：纯文本写入，不解析任何标记
  $('bodyBefore').replaceChildren(...toParagraphs(d.body_before));
  const resolved = d.status === 'resolved' && d.body_after;
  $('blockAfter').hidden = !resolved;
  if (resolved) $('bodyAfter').replaceChildren(...toParagraphs(d.body_after));

  const hint = $('openHint');
  hint.hidden = d.status !== 'open';
  // 同一句话对读者和作者不能一样：作者看到的「作者」就是自己
  hint.textContent = d.is_author
    ? '这是你写的。等后来发生了什么，随时可以回来补上——不着急。'
    : '作者还没写后来。如果你正走在这段路上，可以先看看别人怎么走的。';
  syncThanks(d);   // 计数、已致谢状态、能不能点，都交给一个函数决定
  currentDetail = d;          // 海报要用完整数据，示例内容也要能生成
  syncFab(d);                 // V1.3 右下角：脚印（共鸣）与点赞

  // 补写入口只给作者，且只在「还没走完」时给
  $('compose').hidden = !(d.is_author && d.status === 'open');

  warmNext(d);                // V1.2 读完之后的出口：同主题的下一段
  show('article');
  document.title = `${d.title} · 人生的路你走到哪了`;
}

function toParagraphs(text) {
  return String(text || '')
    .split(/\n+/)
    .map((s) => s.trim())
    .filter(Boolean)
    .map((s) => {
      const p = document.createElement('p');
      p.className = 'prose__p';
      p.textContent = s;
      return p;
    });
}

/* ---------- 致谢 ---------- */

let thanksState = { id: null, count: 0, done: false, can: false };

function syncThanks(d) {
  thanksState = {
    id: d.id,
    count: d.thanks_count || 0,
    done: Boolean(d.thanked),
    can: !(d.is_author || d.is_sample || d.status === 'hidden'),
  };
  const btn = $('btnThanks');
  const n = thanksState.count;
  $('thanksText').textContent = thanksState.done
    ? `已致谢 · ${n} 人觉得被帮到`
    : `${n} 人觉得被帮到`;
  // 示例内容直接不显示入口，别让人点完才知道不行
  btn.hidden = Boolean(d.is_sample);
  btn.disabled = !thanksState.can || thanksState.done;
  btn.classList.toggle('thanks--done', thanksState.done);
  btn.title = d.is_author ? '不能给自己的内容致谢'
    : thanksState.done ? '你已经致谢过了' : '';
}

$('btnThanks').addEventListener('click', async () => {
  if (!thanksState.can || thanksState.done) return;
  const btn = $('btnThanks');
  btn.disabled = true;
  try {
    const r = await api.thanks(thanksState.id);
    thanksState.count = r.thanks_count;
    thanksState.done = true;
    $('thanksText').textContent = `已致谢 · ${r.thanks_count} 人觉得被帮到`;
    btn.classList.add('thanks--done');
    btn.title = '你已经致谢过了';
  } catch (e) {
    if (e instanceof ApiError && (e.isGateClosed || e.isAuthLost)) { location.href = window.Renlu.gateUrl(); return; }
    $('thanksText').textContent = `没能致谢：${(e && e.message) || '稍后再试'}`;
    btn.disabled = false;
  }
});

/* ---------- 右下角固定交互：足迹（共鸣）+ 点赞 + 收藏 ----------

   为什么是 fixed：读完一段时手指往往已经滑到正文底部，互动按钮如果跟着走，
   读者想起「我也走过」时还得往回找。固定住，位置永远一致。

   三个按钮都是 toggle：点过再点一下就取消。可见性、可点性、计数文案
   全在 renderFab 里决定，事件处理器只负责改 state 再调它一次。 */

let currentDetail = null;
let resonateState = { id: null, count: 0, done: false, can: false };
let likeState = { id: null, count: 0, liked: false, can: false };
let favState = { id: null, favorited: false, can: false };

function renderFab() {
  const foot = $('fabFoot');
  const like = $('fabLike');
  const fav = $('fabFav');

  $('fabFootText').textContent = resonateState.count;
  foot.classList.toggle('fab__btn--on', resonateState.done);
  foot.disabled = !resonateState.can;
  foot.title = resonateState.can
    ? (resonateState.done ? '再点一下取消打点' : '我也走过这段')
    : '自己的路标不用打点';

  $('fabLikeText').textContent = likeState.count;
  like.classList.toggle('fab__btn--on', likeState.liked);
  like.disabled = !likeState.can;
  like.title = likeState.can
    ? (likeState.liked ? '再点一下取消点赞' : '点个赞')
    : '自己的路标不用点赞';

  // 收藏没有数字，状态只靠高亮和那个小圆点
  fav.classList.toggle('fab__btn--on', favState.favorited);
  fav.classList.toggle('fab__btn--marked', favState.favorited);
  fav.disabled = !favState.can;
  fav.title = favState.can
    ? (favState.favorited ? '再点一下取消收藏' : '加个星标收藏')
    : '自己的路标不用收藏';
}

/* 示例内容照样能看能生成海报，但不参与任何计数，整块按钮隐藏 */
function syncFab(d) {
  const usable = !d.is_sample && d.status !== 'hidden';
  $('fab').hidden = !usable;
  if (!usable) return;

  resonateState = { id: d.id, count: '…', done: false, can: !d.is_author };
  likeState = { id: d.id, count: '…', liked: false, can: !d.is_author };
  favState = { id: d.id, favorited: false, can: !d.is_author };
  renderFab();

  // 两个查询并行：一个拿点赞/收藏，一个拿共鸣。谁先回来谁先填，互不等待。
  api.interactState([d.id]).then((r) => {
    const x = (r.items || []).find((i) => String(i.story_id) === String(d.id));
    if (!x) return;
    likeState.count = x.like_count || 0;
    likeState.liked = Boolean(x.liked);
    favState.favorited = Boolean(x.favorited);
    renderFab();
  }).catch(() => { /* 计数拿不到就保持 …，不瞎报 0 */ });

  api.resonateState([d.id]).then((r) => {
    const x = (r.items || []).find((i) => String(i.story_id) === String(d.id));
    if (!x) return;
    resonateState.count = x.resonate_count || 0;
    resonateState.done = Boolean(x.resonated);
    renderFab();
  }).catch(() => { $('fabFoot').hidden = true; });
}

/* 点中时轻轻弹一下：这是全站唯一会「有回应」的动作，值得一点反馈 */

  el.classList.remove('fab__btn--pop');
  void el.offsetWidth;                 // 强制重排，否则连点第二次动画不会重播
  el.classList.add('fab__btn--pop');
}

});

/* ---------- V1.1 海报：canvas 画一张可长按保存的图 ---------- */

const POSTER_QR = 'assets/qr-share.png?v=20261105m';
const POSTER_FONT = '-apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';

/* 按像素宽折行；maxLines 折满后把最后一行截成「…」结尾。
   带中文禁则：行首不允许出现句读点，折行时把它带回上一行行尾。 */
const POSTER_NO_LINE_START = '，。、！？；：）】」』%·…';
function wrapLines(g, text, maxW, maxLines) {
  const lines = [];
  let line = '';
  for (const ch of String(text || '').replace(/\s+/g, ' ').trim()) {
    if (g.measureText(line + ch).width > maxW && line) {
      // 下一个字符会挪到新行——若它是句读点，违反禁则，塞回本行行尾
      if (POSTER_NO_LINE_START.includes(ch)) {
        lines.push(line + ch);
        line = '';
      } else {
        lines.push(line);
        line = ch;
      }
      if (lines.length === maxLines) {
        const last = lines[maxLines - 1];
        lines[maxLines - 1] = POSTER_NO_LINE_START.includes(last.slice(-1))
          ? last : last.slice(0, -1) + '…';
        return lines;
      }
    } else {
      line += ch;
    }
  }
  if (line && lines.length < maxLines) lines.push(line);
  return lines;
}

function drawPoster(d) {
  return new Promise((resolve, reject) => {
    const W = 750, H = 1180;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');

    // 夜空底：从上到下三段渐变，和站内夜色一个气质
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0b1220');
    bg.addColorStop(0.55, '#152840');
    bg.addColorStop(1, '#0b1220');
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    // 星星：固定种子的伪随机，同一张海报每次画出来都一样。
    // 撒到全幅 85%，越往下越稀，避免中段一大片空
    let seed = 20261101;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    g.fillStyle = '#dfe9f5';
    for (let i = 0; i < 170; i++) {
      const fy = rnd();
      const x = rnd() * W, y = fy * H * 0.85, r = rnd() * 1.5 + 0.4;
      g.globalAlpha = (rnd() * 0.6 + 0.25) * (1 - fy * 0.55);
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;

    // 标题区右侧一团极淡的光，把视线引到第一行
    const glow = g.createRadialGradient(W * 0.78, 150, 20, W * 0.78, 150, 300);
    glow.addColorStop(0, 'rgba(143, 184, 216, 0.16)');
    glow.addColorStop(1, 'rgba(143, 184, 216, 0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, W, 480);

    // 顶部站点名
    g.fillStyle = '#8fb8d8';
    g.font = `500 24px ${POSTER_FONT}`;
    g.fillText('人生的路你走到哪了', 56, 88);

    // 标题：最多两行
    g.fillStyle = '#f2f6fa';
    g.font = `600 46px ${POSTER_FONT}`;
    let y = 190;
    wrapLines(g, d.title || '', W - 112, 2).forEach((ln) => {
      g.fillText(ln, 56, y);
      y += 64;
    });

    // 引文：取「当时」的第一段，最多四行
    g.fillStyle = '#b9c8d6';
    g.font = `400 27px ${POSTER_FONT}`;
    y += 26;
    wrapLines(g, (d.body_before || '').split('\n')[0], W - 112, 4).forEach((ln) => {
      g.fillText(ln, 56, y);
      y += 46;
    });

    // 分隔线 + 作者与日期：锚在二维码上方，中段留给夜空呼吸
    const divY = H - 352;
    g.strokeStyle = 'rgba(143, 184, 216, 0.35)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(56, divY); g.lineTo(W - 56, divY); g.stroke();
    g.fillStyle = '#8fa3b5';
    g.font = `400 25px ${POSTER_FONT}`;
    const dt = d.created_at ? String(d.created_at).slice(0, 10) : '';
    g.fillText(`写下的人：${d.author_nickname || '路过的人'}　${dt}`, 56, divY + 54);

    // 底部：二维码 + 引导语
    const img = new Image();
    img.onload = () => {
      g.drawImage(img, 56, H - 56 - 170, 170, 170);
      g.fillStyle = '#dfe9f5';
      g.font = `600 30px ${POSTER_FONT}`;
      g.fillText('这条路的故事，从这里看', 256, H - 128);
      g.fillStyle = '#7d92a6';
      g.font = `400 22px ${POSTER_FONT}`;
      g.fillText('匿名 · 不评价 · 只是看见', 256, H - 88);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => reject(new Error('二维码图片没加载出来'));
    img.src = POSTER_QR;
  });
}

/* ---------- V1.2 再读一段：同主题的下一段 ----------
   详情页拿不到列表页的筛选状态，所以自己按 topic_code 静默预热一份 id 队列，
   点按钮时取当前这条之后的一篇，走到头就绕回第一篇。不新增后端接口。
   跳转必须带着 location.search 走 —— sharecode 靠它放行静态资源，丢了就是白屏。 */
const nextQueue = { ids: [], i: 0 };

function warmNext(d) {
  const btn = $('btnNext');
  nextQueue.ids = [];
  nextQueue.i = 0;
  btn.textContent = '再读一段 →';
  btn.disabled = false;
  // status 必须给 null 而不是 'all' —— 后端只认 open / resolved / null，
  // 传 'all' 会当成「状态等于 all」去匹配，一条都查不到
  api.list({ topic: d.topic_code || null, status: null, page: 1, size: 10 })
    .then((r) => {
      // 排掉自己：连点两下还是同一条，会让人以为按钮坏了
      nextQueue.ids = (r.items || [])
        .map((x) => String(x.story_id))
        .filter((id) => id !== String(d.id));
      if (!nextQueue.ids.length) btn.textContent = '看全部故事 →';
    })
    .catch(() => { nextQueue.ids = []; btn.textContent = '看全部故事 →'; });
}

/* 只换 id，其余查询参数（sharecode / k）原样带走 */
function goWithStory(id) {
  const u = new URL(location.href);
  u.searchParams.set('id', id);
  location.href = (u.pathname.replace(/^\//, '') || 'story.html') + u.search;
}

function goAllStories() {
  const u = new URL(location.href);
  u.searchParams.delete('id');
  location.href = 'index.html' + u.search;
}

$('btnNext').addEventListener('click', () => {
  if (!nextQueue.ids.length) { goAllStories(); return; }
  if (nextQueue.i >= nextQueue.ids.length) nextQueue.i = 0;   // 读到头了绕回去
  goWithStory(nextQueue.ids[nextQueue.i++]);
});

/* ---------- V1.2 复制这段的链接 ----------
   海报里那张二维码是整站一张、只落到首页，收海报的人翻不到这一段。
   这里给出带 id 的完整地址。sharecode 必须在里面 —— 少了它对方用新浏览器
   第一次请求就是 403（静态资源靠它放行），打开是白屏。 */
function storyShareUrl() {
  const u = new URL(location.href);
  if (storyId) u.searchParams.set('id', storyId);
  u.searchParams.delete('v');       // 版本参数只对本站绕缓存有意义，分享出去只会变长
  return u.href;
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 微信 X5 常把 clipboard API 禁掉，往下走回退 */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

$('btnCopyLink').addEventListener('click', async () => {
  const btn = $('btnCopyLink');
  const tip = $('posterLink');
  const url = storyShareUrl();
  if (await copyText(url)) {
    btn.textContent = '已复制 ✓';
    tip.hidden = true;
    setTimeout(() => { btn.textContent = '复制这段的链接'; }, 2000);
  } else {
    // 复制不了就把链接摊出来，长按整条选中
    btn.textContent = '长按下面的链接复制';
    tip.textContent = url;
    tip.hidden = false;
  }
});

$('btnPoster').addEventListener('click', async () => {
  if (!currentDetail) return;
  const layer = $('posterLayer');
  const btn = $('btnPoster');
  btn.disabled = true;
  try {
    const url = await drawPoster(currentDetail);
    $('posterImg').src = url;
    layer.hidden = false;
  } catch (e) {
    alert('海报没画出来：' + ((e && e.message) || '稍后再试'));
  } finally {
    btn.disabled = false;
  }
});
$('btnPosterClose').addEventListener('click', () => { $('posterLayer').hidden = true; });
$('posterLayer').addEventListener('click', (e) => {
  if (e.target === $('posterLayer')) $('posterLayer').hidden = true;
});

/* ---------- 补写 ---------- */

function bindResolve(id) {
  const form = $('resolveForm');
  const input = $('afterInput');
  const err = $('resolveErr');

  input.addEventListener('input', () => {
    $('afterCount').textContent = `${input.value.trim().length} / 2000`;
    err.textContent = '';
  });

  $('btnOpenResolve').addEventListener('click', () => {
    form.hidden = false;
    $('btnOpenResolve').hidden = true;
    input.focus();
  });

  $('btnCancelResolve').addEventListener('click', () => {
    form.hidden = true;
    $('btnOpenResolve').hidden = false;
    err.textContent = '';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (text.length < 50) {
      err.textContent = `再写一点，至少 50 个字（现在 ${text.length} 个）`;
      return;
    }
    const btn = $('btnSubmitResolve');
    btn.disabled = true;
    btn.textContent = '保存中…';
    try {
      await api.resolve(id, text);
      await load();               // 成功后重新拉一次，状态由服务端决定，不在前端猜
    } catch (ex) {
      err.textContent = ex.message || '没能保存，稍后再试';
    } finally {
      btn.disabled = false;
      btn.textContent = '写完这段';
    }
  });
}

/* ---------- 加载 ---------- */

async function load() {
  if (!storyId || !/^\d+$/.test(storyId)) {
    show('missing');
    return;
  }
  show('loading');
  try {
    const d = await api.detail(storyId);
    render(d);
    // V1.3 浏览记录：不 await、不报错。记不上只影响「我的-浏览记录」，
    // 绝不能因为它让正文卡住或弹错
    api.view(storyId).catch(() => {});
  } catch (e) {
    if (e instanceof ApiError) {
      if (e.isGateClosed || e.isAuthLost) { location.href = window.Renlu.gateUrl(); return; }
      if (e.isNotFound) { show('missing'); return; }
    }
    $('failMsg').textContent = (e && e.message) || '稍后再试';
    show('failed');
  }
}

$('btnRetry').addEventListener('click', load);
load();
bindResolve(storyId);
</script>
