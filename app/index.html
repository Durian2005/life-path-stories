<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 受控预览：不让搜索引擎收录（PRD F0） -->
<meta name="robots" content="noindex, nofollow">
<title>人生的路你走到哪了</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap nav__inner">
    <a class="nav__brand" href="index.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5.5 18.5c0-4 3.6-4.2 6.3-6.6 2.7-2.4 6.2-2.6 6.7-6.4"/>
        <circle cx="5.5" cy="18.5" r="1.7" fill="currentColor" stroke="none"/>
        <circle cx="18.5" cy="5.5" r="1.7" fill="currentColor" stroke="none"/>
      </svg>
      <span>人生的路你走到哪了</span>
      <span style="color:var(--ink-3)">.</span>
    </a>

    <div class="nav__right">
      <span class="nav__tagline">每一段路，都值得被看见</span>
      <span class="pill">探索版</span>
      <a class="nav__add" href="write.html" aria-label="写一段我的经历">+</a>
    </div>
  </div>
</nav>

<header class="hero">
  <img class="hero__img" src="assets/hero.jpg" alt="">
  <div class="wrap">
    <div class="hero__inner">
      <p class="hero__eyebrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="m9 15 2.2-4.2L15.5 9l-2.2 4.2z"/>
        </svg>
        人生没有标准路线
      </p>

      <h1 class="hero__title">人生的路，<br>你走到哪了？</h1>

      <p class="hero__text">
        遇到相似的困惑，也许有人走过这段路。<br>
        读读他们经历了什么、尝试了什么。<br>
        找到一点共鸣，也找到自己的下一步。
      </p>

      <a class="btn btn--primary" href="#stories">
        开始探索
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </a>

      <p class="hero__note">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 2 4 14h6l-1 8 9-12h-6z"/>
        </svg>
        不必赶路，按自己的节奏就好
      </p>
    </div>
  </div>

  <span class="hero__badge">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/>
    </svg>
    每个人都有一段自己的路线
  </span>
</header>

<main>
  <div class="wrap">

    <div class="banner" id="banner" hidden></div>

    <section class="section">
      <div class="section__head">
        <h2 class="section__title">你正走在哪一段？</h2>
        <span class="section__meta">人生路径 · 01</span>
      </div>
      <p class="section__desc">选一个最贴近现在的，看看走过这条路的人。</p>
      <div class="paths" id="paths" role="group" aria-label="按主题选择"></div>
    </section>

    <section class="section" id="stories">
      <div class="section__head">
        <h2 class="section__title">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2.6l1.9 5.6 5.6 1.9-5.6 1.9L12 17.6l-1.9-5.6L4.5 10l5.6-1.9z"/>
            <path d="M18.6 15.4l.9 2.5 2.5.9-2.5.9-.9 2.5-.9-2.5-2.5-.9 2.5-.9z" opacity=".65"/>
          </svg>
          <span><span id="listTitle">升学备考</span> · 路上的故事</span>
        </h2>
        <a class="section__more" href="#" id="showAll">全部故事 →</a>
      </div>

      <div class="toolbar">
        <div class="search">
          <span class="search__icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
            </svg>
          </span>
          <input class="search__input" id="keyword" type="search"
                 placeholder="搜一个词，比如「考研」「实习」「室友」" autocomplete="off">
        </div>

        <div class="tabs" role="tablist" aria-label="按状态筛选">
          <button class="tabs__item" role="tab" aria-selected="true"  data-status="all">全部</button>
          <button class="tabs__item" role="tab" aria-selected="false" data-status="open">还没走完</button>
          <button class="tabs__item" role="tab" aria-selected="false" data-status="resolved">走过这一段</button>
        </div>
      </div>

      <p class="count" id="count">正在加载…</p>
      <div class="stories" id="list" aria-live="polite"></div>

      <!-- 列表底部：加载更多 / 没有更多了 / 上限提示，三态同一块 DOM（F3） -->
      <div class="listfoot" id="listFoot" hidden>
        <button class="btn btn--ghost btn--sm" id="btnMore" type="button">加载更多</button>
        <p class="listfoot__text" id="footText"></p>
      </div>
    </section>

    <div class="actions">
      <a class="btn btn--primary" href="write.html">写下我的这一段</a>
      <a class="btn btn--ghost" href="me.html">我的经历</a>
    </div>

    <footer class="foot">
      内容由参与者自愿分享，观点属作者个人。本站不提供心理或医疗建议；<br>
      如你正处于危机中，请优先联系身边可信任的人或当地专业机构。
    </footer>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="assets/cloud-config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/boot.js"></script>
<script>
const { api, ApiError, cloudReady } = window.Renlu;

/* 开放主题（PRD RS-1：V1 开 5 个）。改这里要同步 app_config.topic_open */
const TOPICS = [
  { code: 'study',    name: '升学备考', desc: '考试、二战、调剂的日子',   icon: 'book' },
  { code: 'job',      name: '找工作',   desc: '简历、面试、第一份工作',   icon: 'case' },
  { code: 'growth',   name: '自我成长', desc: '想清楚自己到底要什么',     icon: 'leaf' },
  { code: 'relation', name: '关系',     desc: '和室友、家人、朋友的事',   icon: 'chat' },
  { code: 'daily',    name: '过日子',   desc: '吃饭、房租、熬夜的日子',   icon: 'cup' },
];

const ICONS = {
  book: '<path d="M5 6.2A2.2 2.2 0 0 1 7.2 4H19v16H7.2A2.2 2.2 0 0 1 5 17.8z"/><path d="M9 4v16"/>',
  case: '<rect x="3.2" y="7.4" width="17.6" height="12.4" rx="2.2"/><path d="M8.6 7.4V5.8a2 2 0 0 1 2-2h2.8a2 2 0 0 1 2 2v1.6"/><path d="M3.2 12.6h17.6"/>',
  leaf: '<path d="M12 20.5c0-6.4 3.2-11 8.2-12.2-1 8.4-4.4 12.2-8.2 12.2z"/><path d="M12 20.5c0-4.8-2-7.8-5.2-8.8"/>',
  chat: '<path d="M20.6 11.8a7.8 7.8 0 0 1-7.8 7.8H8l-4 2.6v-4.1a7.8 7.8 0 0 1 3.4-13.9h5.4a7.8 7.8 0 0 1 7.8 7.6z"/>',
  cup: '<path d="M6 8.6h9.4v5.4a4.7 4.7 0 0 1-9.4 0z"/><path d="M15.4 10.2h1.2a2.2 2.2 0 0 1 0 4.4h-1.2"/>',
};

const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';


const PAGE_SIZE = 10;          // R3-1：每页固定 10 条，不跟着屏幕大小变

const state = {
  topic: 'study', status: 'all', keyword: '',
  page: 0,                     // 已成功取到的页码，0 = 一页还没拿到
  hasMore: false,
  truncated: false,
  loading: false,
  seq: 0,                      // 请求序号：只有最后一次筛选的响应算数（E3-3）
  seen: new Set(),             // 已渲染的 id，追加时据此去重（R3-2）
};

const $ = (id) => document.getElementById(id);
const elPaths = $('paths');
const elList = $('list');
const elCount = $('count');
const elBanner = $('banner');
const elTitle = $('listTitle');
const elFoot = $('listFoot');
const elMore = $('btnMore');
const elFootText = $('footText');

/* ---------- 图标 ---------- */

function icon(name) {
  return `<svg class="path__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

/* ---------- 渲染：路径卡 ---------- */

function renderPaths(counts = {}) {
  elPaths.replaceChildren();

  TOPICS.forEach((t) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'path';
    btn.dataset.topic = t.code;
    btn.setAttribute('aria-pressed', String(state.topic === t.code));

    const n = counts[t.code];
    btn.innerHTML = `
      ${icon(t.icon)}
      <p class="path__title">${t.name}${n ? `<span class="path__count">${n}</span>` : ''}</p>
      <p class="path__desc">${t.desc}</p>
      <span class="path__arrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 6l6 6-6 6"/>
        </svg>
      </span>
      <span class="path__mark">${CHECK}</span>`;

    btn.addEventListener('click', () => {
      state.topic = t.code;
      renderPaths(counts);
      syncTitle();
      load();
    });

    elPaths.appendChild(btn);
  });
}

function syncTitle() {
  if (!state.topic) { elTitle.textContent = '所有路'; return; }
  const t = TOPICS.find((x) => x.code === state.topic);
  elTitle.textContent = t ? t.name : '所有路';
}

/* ---------- 渲染：故事卡（用户内容一律 textContent） ---------- */

function statusTag(status) {
  return status === 'resolved'
    ? '<span class="tag tag--resolved">走过这一段</span>'
    : '<span class="tag tag--open">还没走完</span>';
}

/* R3-4：卡片时间一律取 created_at；当天写「今天」，昨天写「昨天」 */
function fmtCardDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const dayStart = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((dayStart(new Date()) - dayStart(d)) / 86400000);
  if (days === 0) return '今天';
  if (days === 1) return '昨天';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function makeCard(s) {
  const a = document.createElement('a');
  a.className = 'story';
  a.href = `story.html?id=${encodeURIComponent(s.id)}`;

  const head = document.createElement('div');
  head.className = 'story__head';
  head.innerHTML = statusTag(s.status);          // 静态标记
  if (s.is_sample) {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = '示例';
    head.appendChild(b);
  }
  a.appendChild(head);

  const h = document.createElement('h3');
  h.className = 'story__title';
  h.textContent = s.title;
  a.appendChild(h);

  const p = document.createElement('p');
  p.className = 'story__excerpt';
  p.textContent = s.summary || '';
  a.appendChild(p);

  const meta = document.createElement('div');
  meta.className = 'story__meta';

  // R3-5 / R3-6：「更新过」只认服务端的 updated，前端不拿两个时间自己比
  const time = document.createElement('span');
  time.className = 'story__time';
  time.textContent = fmtCardDate(s.created_at) + (s.updated ? ' · 更新过' : '');

  const who = document.createElement('span');
  who.textContent = s.author_nickname || '';
  const cnt = document.createElement('span');
  cnt.textContent = `${s.thanks_count || 0} 人致谢`;
  meta.append(time, who, cnt);
  a.appendChild(meta);

  return a;
}

/* 追加一页：只往后加，已有卡片不动（R3-7 的后半句） */
function appendList(items) {
  const frag = document.createDocumentFragment();
  let added = 0;

  items.forEach((s) => {
    const key = String(s.id);
    if (state.seen.has(key)) return;      // R3-2：重复 id 直接丢掉
    state.seen.add(key);
    frag.appendChild(makeCard(s));
    added += 1;
  });

  elList.appendChild(frag);
  return added;
}

/* 换筛选：整块换掉，去重表一起清空 */
function renderList(items) {
  elList.replaceChildren();
  state.seen = new Set();

  if (!items.length) {
    elList.innerHTML = `
      <div class="empty">
        <span class="empty__title">这一段还没有人写</span>
        你可以是第一个。哪怕只写清楚「当时卡在哪」，对后来的人就是有用的。
      </div>`;
    return 0;
  }

  return appendList(items);
}

/* ---------- 列表底部 ---------- */

function addSkeletons(n = 3) {
  for (let i = 0; i < n; i += 1) {
    const d = document.createElement('div');
    d.className = 'skeleton skeleton--more';
    d.setAttribute('aria-hidden', 'true');
    elList.appendChild(d);
  }
}

function removeSkeletons() {
  elList.querySelectorAll('.skeleton--more').forEach((n) => n.remove());
}

/**
 * 底部只有这几种样子，全在这一处决定：
 *   borrow  还没有任何结果，整块不出现（空态自己会说话）
 *   loading 正在取下一页，按钮置灰
 *   more    还有下一页，给「加载更多」按钮
 *   end     全部加载完了（R3-3）
 *   cap     到了 100 条上限，不再发起请求（R2-9 / E3-4）
 *   error   这一页没取到，已加载的留着，按钮改成重试（E3-2）
 */
function renderFoot(mode) {
  elMore.hidden = true;
  elMore.disabled = false;
  elMore.textContent = '加载更多';
  elFootText.textContent = '';

  if (mode === 'borrow') { elFoot.hidden = true; return; }
  elFoot.hidden = false;

  if (mode === 'loading') {
    elMore.hidden = false;
    elMore.disabled = true;
    elMore.textContent = '正在加载…';
    return;
  }
  if (mode === 'more') { elMore.hidden = false; return; }
  if (mode === 'end') { elFootText.textContent = '没有更多了'; return; }
  if (mode === 'cap') { elFootText.textContent = '只展示前 100 条，试试更具体的关键词'; return; }
  if (mode === 'error') {
    elMore.hidden = false;
    elMore.textContent = '加载失败，点击重试';
  }
}

/* ---------- 触底自动加载 ---------- */

let footVisible = false;
let lastAutoAt = 0;
let pendingAuto = 0;

/* 距底部 200px 以内就算触底（F3 触发条件），比监听 scroll 省事也更准 */
const io = new IntersectionObserver((entries) => {
  footVisible = entries[0].isIntersecting;
  if (footVisible) autoMore();
}, { rootMargin: '0px 0px 200px 0px' });

io.observe(elFoot);

function autoMore() {
  if (!footVisible || state.loading || !state.hasMore) return;

  // R3-8：1.5 秒内不重复触发。被挡下的这次不丢掉，等窗口过去补一次，
  // 否则「这一页没让列表长高、哨兵一直可见」时，用户会卡在底部没有任何反馈。
  const wait = 1500 - (Date.now() - lastAutoAt);
  if (wait > 0) {
    clearTimeout(pendingAuto);
    pendingAuto = setTimeout(autoMore, wait + 20);
    return;
  }

  lastAutoAt = Date.now();
  load(true);
}

elMore.addEventListener('click', () => {
  if (state.loading || !state.hasMore) return;
  lastAutoAt = Date.now();
  load(true);
});

function showBanner(html, warn = false) {
  elBanner.hidden = false;
  elBanner.className = warn ? 'banner banner--warn' : 'banner';
  elBanner.innerHTML = html;
}

/* ---------- 加载 ---------- */

/* 主题卡上的条数只在进页面时取一次：它不随翻页变化，没必要跟着每次筛选重发 */
async function loadTopics() {
  try {
    const t = await api.topics();
    const counts = {};
    (t.items || []).forEach((x) => { counts[x.topic_code] = x.count; });
    renderPaths(counts);
  } catch (e) {
    if (e instanceof ApiError && e.isGateClosed) { location.replace('gate.html'); return; }
    // 条数取不到不影响读列表，主题卡保持无数字
  }
}

async function load(append = false) {
  // 追加要防重入；换筛选不受这条约束——它有权打断正在飞的那次追加（E3-3）
  if (append && (state.loading || !state.hasMore)) return;

  const seq = (state.seq += 1);
  state.loading = true;
  let ok = false;

  if (append) {
    addSkeletons();                        // R3-7：底部 3 个骨架，已有卡片不动
    renderFoot('loading');
  } else {
    state.page = 0;
    state.hasMore = false;
    elCount.textContent = '正在加载…';
    elList.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    renderFoot('borrow');
  }

  const wantPage = append ? state.page + 1 : 1;

  try {
    const r = await api.list({
      topic: state.topic,
      status: state.status === 'all' ? null : state.status,
      keyword: state.keyword || null,
      page: wantPage,
      size: PAGE_SIZE,
    });
    if (seq !== state.seq) return;         // 已有更新的筛选，这次结果整份作废
    removeSkeletons();

    const items = r.items || [];
    state.page = r.page || wantPage;
    state.hasMore = Boolean(r.has_more);
    state.truncated = Boolean(r.truncated);

    // 只有第一页的 total 可信：翻过一页之后再报数会把人吓一跳（RI-11）
    if (state.page === 1) elCount.textContent = `共 ${r.total} 条`;

    const added = append ? appendList(items) : renderList(items);
    ok = true;

    if (!items.length && !added) renderFoot('borrow');
    else if (state.hasMore) renderFoot('more');
    else renderFoot(state.truncated ? 'cap' : 'end');
  } catch (e) {
    if (seq !== state.seq) return;
    removeSkeletons();
    if (!append) { handleError(e); return; }
    renderFoot('error');                   // E3-2：已加载的照旧留着
  } finally {
    if (seq === state.seq) state.loading = false;
  }

  // 走到这里说明是最后一次请求且没出错。列表不满一屏就直接续上，
  // 别让用户对着半屏内容还得先滚一下才有下一页。
  if (ok && state.hasMore) autoMore();
}

function handleError(e) {
  // 没进站：直接去门页，不在这里解释原因
  if (e instanceof ApiError && e.isGateClosed) {
    location.replace('gate.html');
    return;
  }
  elCount.textContent = '没加载出来';
  elList.innerHTML = `<div class="empty">
      <span class="empty__title">内容没能加载</span>
      <span id="errMsg"></span><br>
      <button class="btn btn--ghost" style="margin-top:16px" onclick="location.reload()">重新加载</button>
    </div>`;
  $('errMsg').textContent = e.message || '稍后再试';
}

/* ---------- 交互 ---------- */

document.querySelectorAll('.tabs__item').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs__item').forEach((b) => b.setAttribute('aria-selected', 'false'));
    btn.setAttribute('aria-selected', 'true');
    state.status = btn.dataset.status;
    load();
  });
});

$('showAll').addEventListener('click', (ev) => {
  ev.preventDefault();
  state.topic = null;
  renderPaths({});
  syncTitle();
  load();
});

let timer = null;
$('keyword').addEventListener('input', (ev) => {
  clearTimeout(timer);
  const v = ev.target.value.trim();
  timer = setTimeout(() => {
    if (v === state.keyword) return;
    state.keyword = v;
    load();
  }, 320);
});

syncTitle();
renderPaths({});
loadTopics();
load();

if (!cloudReady()) console.info('[首页] 云端客户端未注入，当前为版式占位状态');
</script>
</body>
</html>
