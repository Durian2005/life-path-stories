<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>管理 · 人生的路你走到哪了</title>
<!-- 主题要在 CSS 之前定，否则深色模式下会闪白一下 -->
<script src="assets/theme.js?v=20261105m"></script>
<link rel="stylesheet" href="assets/style.css?v=20261105m">
</head>
<body>

<header class="nav">
  <div class="wrap nav__inner">
    <a class="nav__brand" href="index.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5.5 18.5c0-4 3.6-4.2 6.3-6.6 2.7-2.4 6.2-2.6 6.7-6.4"/>
        <circle cx="5.5" cy="18.5" r="1.7" fill="currentColor" stroke="none"/>
        <circle cx="18.5" cy="5.5" r="1.7" fill="currentColor" stroke="none"/>
      </svg>
      <span class="nav__brand-full">人生的路你走到哪了</span>
      <span class="nav__brand-short" aria-hidden="true">人生的路</span>
      <span style="color:var(--ink-3)">.</span>
    </a>
    <div class="nav__right">
      <span class="pill">管理</span>
      <button class="theme-toggle" type="button" aria-label="切换白天 / 夜间" aria-pressed="false">
        <span class="theme-toggle__opt" data-mode="light" aria-hidden="true" title="白天">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </span>
        <span class="theme-toggle__opt" data-mode="dark" aria-hidden="true" title="夜间">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </span>
      </button>
    </div>
  </div>
</header>

<main class="wrap admin">

  <!-- 口令。故意不做「记住我」：没有账号体系，口令只活在这个页面的内存里 -->
  <section class="admin-card" id="gatePanel">
    <p class="admin-card__kicker">管理入口</p>
    <h1 class="admin-card__title">输入管理口令</h1>
    <p class="admin-card__desc">
      口令只保存在当前页面内存里，关掉标签页就要重新输入。连续错 8 次会锁 5 分钟。
    </p>
    <form class="admin-form" id="gateForm" autocomplete="off">
      <input class="gate__input" id="passInput" type="password" placeholder="管理口令"
             autocomplete="current-password" aria-label="管理口令">
      <button class="btn btn--primary" type="submit" id="btnLogin">进入</button>
    </form>
    <p class="admin-err" id="gateErr" hidden></p>
  </section>

  <!-- 面板 -->
  <section id="panel" hidden>
    <div class="admin-card">
      <p class="admin-card__kicker">投稿开关</p>
      <p class="admin-state" id="stateText">…</p>
      <p class="admin-card__desc" id="stateDesc"></p>
      <div class="admin-actions">
        <button class="btn btn--primary" type="button" id="btnOpen">开放投稿</button>
        <button class="btn btn--ghost" type="button" id="btnClose">关闭投稿</button>
        <button class="btn btn--ghost" type="button" id="btnLogout">退出</button>
      </div>
    </div>

    <div class="admin-card">
      <p class="admin-card__kicker">最近的内容 <span class="admin-meta" id="listCount"></span></p>
      <p class="admin-card__desc">
        隐藏后列表与详情都看不到（作者仍能看到自己的，会提示「正在处理中」），可以随时恢复。
        删除是软删，内容对所有人消失，但数据库里还留着。
      </p>
      <div class="admin-list" id="list"></div>
    </div>
  </section>

</main>

<script src="assets/workbuddy-sdk.js?v=20261105m"></script>
<script src="assets/cloud-config.js?v=20261105m"></script>
<script src="assets/api.js?v=20261105m"></script>
<script src="assets/boot.js?v=20261105m"></script>
<script>
const { api, ApiError } = window.Renlu;
const $ = (id) => document.getElementById(id);

/* 口令只在内存里。不写 localStorage / sessionStorage：
   管理口令一旦落盘，被 XSS 读到就等于整站被接管。 */
let pass = '';
let state = null;

const STATUS_TEXT = { open: '还没走完', resolved: '走过这一段', hidden: '已隐藏' };

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function showErr(el, msg) {
  if (!msg) { el.hidden = true; el.textContent = ''; return; }
  el.hidden = false;
  el.textContent = msg;
}

/* 业务码 → 人话。42901 是锁了，40303 是口令不对，40302 是没设口令 */
function explain(e) {
  if (!(e instanceof ApiError)) return '出了点问题，稍后再试';
  if (e.code === 40303) return '口令不对';
  if (e.code === 42901) return '试错次数太多，等 5 分钟再试';
  if (e.code === 40302) return '管理入口还没开通（数据库里没有设口令）';
  if (e.code === 40101 || e.code === 40301) return '身份失效，刷新一下页面';
  return e.message || '出了点问题，稍后再试';
}

/* ---------- 渲染 ---------- */

function renderState() {
  const open = state.publish_open;
  $('stateText').textContent = open ? '现在：已开放投稿' : '现在：已关闭投稿';
  $('stateText').className = 'admin-state' + (open ? ' admin-state--on' : ' admin-state--off');
  $('stateDesc').textContent = open
    ? '观众点开链接就能写一段，写完立刻出现在列表最前面。'
    : '首页的「+」和「写下我的这一段」都会藏起来，直接调接口也会被拒绝（code 43001）。';
  $('btnOpen').disabled = open;
  $('btnClose').disabled = !open;
}

function renderList() {
  const box = $('list');
  box.innerHTML = '';
  const items = state.items || [];
  $('listCount').textContent = `共 ${state.total} 条` + (state.hidden ? ` · ${state.hidden} 条已隐藏` : '');

  if (!items.length) {
    const p = document.createElement('p');
    p.className = 'admin-empty';
    p.textContent = '还没有内容。';
    box.append(p);
    return;
  }

  items.forEach((it) => {
    const row = document.createElement('div');
    row.className = 'admin-row';

    const main = document.createElement('div');
    main.className = 'admin-row__main';

    const title = document.createElement('p');
    title.className = 'admin-row__title';
    title.textContent = it.title;

    const meta = document.createElement('p');
    meta.className = 'admin-row__meta';
    const bits = [it.author, fmtTime(it.created_at), STATUS_TEXT[it.status] || it.status];
    if (it.visibility === 'private') bits.push('仅自己可见');
    if (it.is_sample) bits.push('示例');
    meta.textContent = bits.join(' · ');

    main.append(title, meta);
    if (it.status === 'hidden') row.classList.add('admin-row--hidden');
    row.append(main);

    const acts = document.createElement('div');
    acts.className = 'admin-row__acts';

    const a = document.createElement('a');
    a.className = 'admin-link';
    a.href = `story.html?id=${it.id}`;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '看';
    acts.append(a);

    if (it.status === 'hidden') {
      const b = document.createElement('button');
      b.className = 'admin-link';
      b.type = 'button';
      b.textContent = '恢复';
      b.addEventListener('click', () => act(it.id, 'restore', b));
      acts.append(b);
    } else {
      const b = document.createElement('button');
      b.className = 'admin-link';
      b.type = 'button';
      b.textContent = '隐藏';
      b.addEventListener('click', () => act(it.id, 'hide', b));
      acts.append(b);
    }

    const del = document.createElement('button');
    del.className = 'admin-link admin-link--danger';
    del.type = 'button';
    del.textContent = '删除';
    del.addEventListener('click', () => {
      if (!confirm(`确认删除「${it.title}」？删除后作者也看不到了。`)) return;
      act(it.id, 'delete', del);
    });
    acts.append(del);

    row.append(acts);
    box.append(row);
  });
}

/* ---------- 动作 ---------- */

async function refresh() {
  state = await api.adminState(pass);
  $('gatePanel').hidden = true;
  $('panel').hidden = false;
  renderState();
  renderList();
}

async function act(id, action, btn) {
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    await api.adminStory(pass, id, action);
    await refresh();
  } catch (e) {
    alert(explain(e));
    btn.disabled = false;
    btn.textContent = old;
  }
}

$('gateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = $('passInput').value.trim();
  if (!v) return;
  $('btnLogin').disabled = true;
  showErr($('gateErr'), '');
  try {
    pass = v;
    await refresh();
    $('passInput').value = '';     // 口令不留在输入框里
  } catch (err) {
    pass = '';
    showErr($('gateErr'), explain(err));
  } finally {
    $('btnLogin').disabled = false;
  }
});

$('btnOpen').addEventListener('click', async () => {
  try {
    await api.adminSetPublish(pass, true);
    await refresh();
  } catch (e) { alert(explain(e)); }
});

$('btnClose').addEventListener('click', async () => {
  try {
    await api.adminSetPublish(pass, false);
    await refresh();
  } catch (e) { alert(explain(e)); }
});

$('btnLogout').addEventListener('click', () => {
  pass = '';
  state = null;
  $('panel').hidden = true;
  $('gatePanel').hidden = false;
  $('passInput').focus();
});
</script>
</body>
</html>
